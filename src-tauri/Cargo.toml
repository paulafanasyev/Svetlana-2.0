[package]
name = "svetlana-desktop"
version = "2.0.0"
description = "Svetlana 2.0 Windows Desktop App"
authors = ["Paul Afanasyev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# API-ключи облачных ИИ — в Диспетчере учётных данных Windows (никогда не в JavaScript)
keyring = { version = "3", features = ["windows-native"] }
# Запросы к облачным ИИ выполняет нативная часть, подставляя ключ сама
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Нативное окно подтверждения Windows: скрипт на странице не может нажать его за пользователя
tauri-plugin-dialog = "2"
# Проверка подлинности скачанных моделей
sha2 = "0.10"
# Локальное распознавание речи (GigaAM-v3) через ONNX Runtime; версия зафиксирована
ort = "=2.0.0-rc.13"
