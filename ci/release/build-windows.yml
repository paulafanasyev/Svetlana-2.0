# Скопируйте ВЕСЬ этот файл в .github/workflows/build-windows.yml (заменив старое содержимое).
# После этого каждая сборка основной ветки публикует установщик в Releases под тегом app-v<версия>
# с постоянным именем Svetlana-2.0-Windows-setup.exe: на него ведёт кнопка «Скачать для Windows» на сайте.
name: Build Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - svetlana-2.0-core-development-0416c
      - feature/windows-hands-mcp-skeleton
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/build-windows.yml"
      - "ci/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Tauri NSIS installer
        run: cargo tauri build --bundles nsis
        working-directory: src-tauri

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if (-not $installer) {
            throw "Tauri build completed without producing an NSIS .exe installer."
          }
          $installer | ForEach-Object {
            Write-Host ("Installer: {0} ({1} bytes)" -f $_.FullName, $_.Length)
          }

      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@v6
        with:
          name: SvetlanaSetup-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release file
        if: github.event_name != 'pull_request'
        id: v
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          Copy-Item $exe.FullName "release-assets/Svetlana-2.0-Windows-setup.exe"
          (Get-FileHash "release-assets/Svetlana-2.0-Windows-setup.exe" -Algorithm SHA256).Hash.ToLower() + "  Svetlana-2.0-Windows-setup.exe" | Out-File -Encoding ascii "release-assets/checksums.txt"

      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.v.outputs.version }}
          name: Светлана 2.0 для Windows ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: |
            release-assets/Svetlana-2.0-Windows-setup.exe
            release-assets/checksums.txt
          body: |
            Светлана 2.0 для Windows 10/11: чат и голос, выбор ИИ, CRM, связь с телефоном.
            Установщик пока без цифровой подписи: если SmartScreen предупредит, «Подробнее» → «Выполнить в любом случае».
            При первом запуске откроется мастер настройки. SHA-256 в checksums.txt.
