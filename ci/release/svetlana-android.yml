# Скопируйте ВЕСЬ этот файл в .github/workflows/svetlana-android.yml (заменив старое содержимое).
# Сборка Светланы для Android (тот же интерфейс, что сайт и Windows) и публикация в Releases
# под тем же тегом app-v<версия>, что и установщик Windows: Svetlana-2.0-Android.apk.
# На него ведёт кнопка «Скачать APK» на сайте.
name: svetlana-android-hands
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - svetlana-2.0-core-development-0416c
    paths: &paths
      - "android-hands/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "csp.mjs"
      - ".github/workflows/svetlana-android.yml"
  pull_request:
    paths: *paths

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android-hands
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: svetlana-hands-debug
          path: android-hands/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release file
        if: github.event_name != 'pull_request'
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          cp android-hands/app/build/outputs/apk/debug/*.apk release-assets/Svetlana-2.0-Android.apk
          (cd release-assets && sha256sum Svetlana-2.0-Android.apk > android-checksums.txt)

      - name: Publish to Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.v.outputs.version }}
          name: Светлана 2.0 ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: |
            release-assets/Svetlana-2.0-Android.apk
            release-assets/android-checksums.txt
