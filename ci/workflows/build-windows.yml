# Готовая замена для .github/workflows/build-windows.yml (см. ci/workflows/README.md).
# Действия закреплены по SHA, Rust и Tauri CLI точных версий, тесты Rust идут перед сборкой,
# и тесты, и установщик собираются строго по одному Cargo.lock (--locked).
name: Build Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - svetlana-2.0-core-development-0416c
      - feature/windows-hands-mcp-skeleton
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/build-windows.yml"
      - "ci/build-windows.yml"
      - "ci/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  TAURI_CLI_VERSION: "2.12.3"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # rustup уже есть на windows-latest: ставим точную версию без сторонних действий.
      - name: Install Rust ${{ env.RUST_VERSION }}
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Cargo.lock из репозитория проверяется на совпадение с Cargo.toml. Если его ещё нет (один раз),
      # он создаётся здесь, до тестов и сборки, и выкладывается артефактом для коммита.
      - name: Cargo.lock
        id: lock
        shell: pwsh
        run: |
          if (Test-Path src-tauri/Cargo.lock) {
            "committed=true" >> $env:GITHUB_OUTPUT
          } else {
            "committed=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Cargo.lock нет в репозитории: скачайте артефакт Cargo-lock и закоммитьте его как src-tauri/Cargo.lock"
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw "Не удалось создать Cargo.lock" }
          }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Cargo.lock не совпадает с Cargo.toml" }

      - name: Upload Cargo.lock
        if: steps.lock.outputs.committed != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 30

      - name: Rust tests
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Тесты Rust упали" }

      - name: Install Tauri CLI ${{ env.TAURI_CLI_VERSION }}
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      # Аргументы после -- уходят в cargo build: установщик собирается по тому же Cargo.lock.
      - name: Build Tauri NSIS installer
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo tauri build --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Сборка установщика упала" }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if (-not $installer) {
            throw "Tauri build completed without producing an NSIS .exe installer."
          }
          $installer | ForEach-Object {
            Write-Host ("Installer: {0} ({1} bytes)" -f $_.FullName, $_.Length)
          }

      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SvetlanaSetup-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
