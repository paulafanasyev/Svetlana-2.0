# Готовая замена для .github/workflows/svetlana-android.yml (см. ci/workflows/README.md).
# Действия закреплены по SHA; модульные тесты идут перед сборкой APK.
name: svetlana-android-hands
on:
  push:
    paths:
      - "android-hands/**"
      - ".github/workflows/svetlana-android.yml"
  pull_request:
    paths:
      - "android-hands/**"
      - ".github/workflows/svetlana-android.yml"
      - "ci/workflows/svetlana-android.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Сборка APK для телефона. Проверка на эмуляторе — отдельно, в svetlana-android-emulator.yml (x86_64 + KVM).
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-hands
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Интерфейс в APK собирается тем же Node 22, что и сайт.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.9"
      - name: Unit tests + debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unit-test-report
          path: android-hands/app/build/reports/tests/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: svetlana-hands-debug
          path: android-hands/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
