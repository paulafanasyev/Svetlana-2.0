name: svetlana-android-hands
on:
  push:
    paths:
      - "android-hands/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/svetlana-android.yml"
  pull_request:
    paths:
      - "android-hands/**"
      - ".github/workflows/svetlana-android.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-hands
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.9"
      - name: Unit tests + debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unit-test-report
          path: android-hands/app/build/reports/tests/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: svetlana-hands-debug
          path: android-hands/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Подписанный релиз, если в секретах репозитория есть ключ (см. ci/workflows/README.md). Иначе в Releases
      # уходит тот же отладочный APK, что и раньше. Секреты доступны только в push основных веток.
      - name: Release signing key (optional)
        id: sign
        if: github.event_name == 'push' && (github.ref == 'refs/heads/svetlana-2.0-core-development-0416c' || github.ref == 'refs/heads/main')
        env:
          KEYSTORE_B64: ${{ secrets.SVETLANA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            umask 077
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SVETLANA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Signed release APK
        if: steps.sign.outputs.signed == 'true'
        env:
          SVETLANA_KEYSTORE_PASSWORD: ${{ secrets.SVETLANA_KEYSTORE_PASSWORD }}
          SVETLANA_KEY_ALIAS: ${{ secrets.SVETLANA_KEY_ALIAS }}
          SVETLANA_KEY_PASSWORD: ${{ secrets.SVETLANA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Pick APK for Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/svetlana-2.0-core-development-0416c' || github.ref == 'refs/heads/main')
        run: |
          mkdir -p ../release-apk
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../release-apk/Svetlana-2.0-Android.apk
          else
            cp "$(ls app/build/outputs/apk/debug/*.apk | head -n 1)" ../release-apk/Svetlana-2.0-Android.apk
          fi
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Upload APK for Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/svetlana-2.0-core-development-0416c' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: svetlana-apk-release
          path: release-apk/Svetlana-2.0-Android.apk
          if-no-files-found: error
          retention-days: 14

  # Публикация в тот же релиз app-v<версия>, что и Windows: на него ведёт «Скачать APK» на сайте.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/svetlana-2.0-core-development-0416c' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: svetlana-apk-release
          path: release-assets
      - name: Checksums
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          (cd release-assets && sha256sum Svetlana-2.0-Android.apk > android-checksums.txt)
      - name: Publish to Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: app-v${{ steps.v.outputs.version }}
          name: Светлана 2.0 ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: |
            release-assets/Svetlana-2.0-Android.apk
            release-assets/android-checksums.txt
