name: Plan 0 Stable Runtime Diagnostic

on:
  push:
    branches: [plan0-stable-runtime-2026-09]
  workflow_dispatch:

jobs:
  stable-ui-diagnostic:
    name: Stable Android UI Accessibility experiment
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Verify hardware virtualization before Android work
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          HV="$(sysctl -n kern.hv_support 2>/dev/null || true)"
          echo "kern.hv_support=$HV"
          test "$HV" = "1"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble native Android APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare diagnostic APK
        run: |
          set -euo pipefail
          mkdir -p android-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android-apk/app-debug.apk
          sha256sum android-apk/app-debug.apk | tee plan0-stable-apk-sha256.txt

      - name: Run clean Settings UI + UIAutomator experiment
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            mkdir -p "$GITHUB_WORKSPACE/plan0-ui-evidence"
            adb devices -l | tee "$GITHUB_WORKSPACE/plan0-ui-evidence/adb-before.txt"
            test "$(adb get-state)" = "device"
            adb shell getprop ro.build.version.sdk | tee "$GITHUB_WORKSPACE/plan0-ui-evidence/sdk.txt"
            bash "$GITHUB_WORKSPACE/.github/scripts/plan0-ui-diagnostic.sh"

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-plan0-stable-runtime-evidence
          path: |
            plan0-stable-apk-sha256.txt
            plan0-ui-evidence
          if-no-files-found: warn
