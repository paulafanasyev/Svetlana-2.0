name: Plan 0 UIAutomator Accessibility Proof

on:
  push:
    branches: [plan0-uiinstrumentation-2026-09]
  pull_request:
    branches: [plan0-stable-runtime-2026-09]
  workflow_dispatch:

jobs:
  plan0-ui-automator:
    name: Real Android UIAutomator Accessibility toggle
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Verify hardware virtualization
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          HV="$(sysctl -n kern.hv_support 2>/dev/null || true)"
          echo "kern.hv_support=$HV"
          test "$HV" = "1"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and instrumentation APK
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          mkdir -p plan0-ui-evidence
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee plan0-ui-evidence/app-debug.sha256
          sha256sum android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee plan0-ui-evidence/androidTest.sha256

      - name: Run real UiAutomator experiment
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            echo "PLAN0_SCRIPT_PWD=$(pwd)"
            echo "PLAN0_GITHUB_WORKSPACE=${GITHUB_WORKSPACE-<unset>}"
            echo "PLAN0_RUNNER_TEMP=${RUNNER_TEMP-<unset>}"
            echo "PLAN0_RUNNER_OS=${RUNNER_OS-<unset>}"
            REPO_ROOT="${GITHUB_WORKSPACE:-$(pwd)}"
            test -n "$REPO_ROOT"
            test -d "$REPO_ROOT"
            OUT_BASE="${RUNNER_TEMP:-$REPO_ROOT}"
            test -d "$OUT_BASE"
            OUT="$OUT_BASE/plan0-ui-evidence"
            APK="$REPO_ROOT/android/app/build/outputs/apk/debug/app-debug.apk"
            TEST_APK="$REPO_ROOT/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            mkdir -p "$OUT"
            test -d "$OUT"
            test -f "$APK"
            test -f "$TEST_APK"
            echo "PLAN0_WORKSPACE=PASS"
            echo "PLAN0_APK_PATH=$APK"
            echo "PLAN0_TEST_APK_PATH=$TEST_APK"
            echo "emulator_ready=$(date -u +%FT%T.%3NZ)" | tee "$OUT/timestamps.txt"
            adb devices -l | tee "$OUT/adb-online.txt"
            test "$(adb get-state)" = "device"
            echo "adb_online=$(date -u +%FT%T.%3NZ)" | tee -a "$OUT/timestamps.txt"
            adb shell getprop sys.boot_completed | tee "$OUT/boot-completed.txt"
            adb shell settings --user 0 get secure enabled_accessibility_services | tee "$OUT/baseline-enabled-services.txt"
            adb shell dumpsys accessibility > "$OUT/baseline-accessibility.txt"
            adb install -r "$APK" | tee "$OUT/app-install.txt"
            adb install -r "$TEST_APK" | tee "$OUT/test-install.txt"
            echo "before_instrumentation=$(date -u +%FT%T.%3NZ)" | tee -a "$OUT/timestamps.txt"
            set +e
            adb shell am instrument -w -r \
              -e class com.svetlana.android.hands.Plan0AccessibilityUiTest#enableSvetlanaAccessibilityThroughSettingsUi \
              com.svetlana.android.hands.test 2>&1 | tee "$OUT/uiautomator-instrumentation.log"
            TEST_RC=${PIPESTATUS[0]}
            set -e
            echo "instrumentation_exit=$TEST_RC" | tee -a "$OUT/timestamps.txt"
            echo "after_instrumentation=$(date -u +%FT%T.%3NZ)" | tee -a "$OUT/timestamps.txt"
            adb shell settings --user 0 get secure enabled_accessibility_services | tee "$OUT/final-enabled-services.txt"
            adb shell settings --user 0 get secure accessibility_enabled | tee "$OUT/final-accessibility-enabled.txt"
            adb shell dumpsys accessibility > "$OUT/final-accessibility.txt"
            adb shell dumpsys package com.svetlana.android.hands > "$OUT/final-package.txt"
            adb logcat -d -b all -v threadtime > "$OUT/final-logcat.txt"
            grep -iE 'onServiceConnected|AccessibilityManagerService|SvetlanaAccessibilityService' "$OUT/final-logcat.txt" | tail -n 500 > "$OUT/accessibility-logcat.txt" || true
            if [ "$TEST_RC" -ne 0 ]; then
              echo "PLAN0_UIAUTOMATOR_RESULT=FAIL"
              exit "$TEST_RC"
            fi
            if ! grep -qF 'com.svetlana.android.hands/com.svetlana.android.hands.SvetlanaAccessibilityService' "$OUT/final-enabled-services.txt"; then
              echo "PLAN0_UIAUTOMATOR_RESULT=FAIL_NO_ENABLED_SERVICE"
              exit 1
            fi
            if ! grep -qF 'PLAN0_SERVICE_CONNECTED=PASS' "$OUT/final-logcat.txt"; then
              echo "PLAN0_UIAUTOMATOR_RESULT=FAIL_NO_ON_SERVICE_CONNECTED"
              exit 1
            fi
            echo "PLAN0_UIAUTOMATOR_RESULT=PASS"

      - name: Upload Plan 0 UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-plan0-uiautomator-evidence
          path: plan0-ui-evidence
          if-no-files-found: warn
