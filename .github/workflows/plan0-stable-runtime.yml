name: Plan 0 UIAutomator Accessibility Proof

on:
  push:
    branches: [plan0-uiinstrumentation-2026-09]
  pull_request:
    branches: [plan0-stable-runtime-2026-09]
  workflow_dispatch:

jobs:
  plan0-ui-automator:
    name: Real Android UIAutomator Accessibility toggle
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Verify hardware virtualization
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          HV="$(sysctl -n kern.hv_support 2>/dev/null || true)"
          echo "kern.hv_support=$HV"
          test "$HV" = "1"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and instrumentation APK
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          mkdir -p plan0-ui-evidence
          shasum -a 256 android/app/build/outputs/apk/debug/app-debug.apk | tee plan0-ui-evidence/app-debug.sha256
          shasum -a 256 android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk | tee plan0-ui-evidence/androidTest.sha256

      - name: Run real UiAutomator experiment
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/.github/scripts/plan0-ui-runtime.sh"

      - name: Upload Plan 0 UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-plan0-uiautomator-evidence
          path: plan0-ui-evidence
          if-no-files-found: warn

      - name: Record workflow revision
        if: always()
        run: git rev-parse HEAD | tee plan0-ui-evidence/workflow-revision.txt
