name: Training Validation

on:
  workflow_dispatch:
  push:
    branches: ['gpu-training-auto-run', 'knowledge-business-expansion-2026-09']
  pull_request:
    branches: [main, develop]

jobs:
  validate-training-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate manifest and all declared dataset paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('training/datasets/manifest_v2.json').read_text(encoding='utf-8'))
          assert m['base_model'] == 'google/gemma-4-E2B-it'
          assert m['runtime_target'] == 'LiteRT-LM'
          assert m['training_mode'] == 'multimodal_agent'
          sections = {'train': m['train'], 'reference_knowledge': m['reference_knowledge'], 'eval': m['eval']}
          for section, entries in sections.items():
              assert entries, f'empty manifest section: {section}'
              for entry in entries:
                  p = Path(entry['path'])
                  assert p.exists(), f'missing {section} dataset: {p}'
                  assert p.is_file(), f'not a file: {p}'
          assert m['rules']['no_eval_in_train'] is True
          assert m['rules']['no_personal_data_in_weights'] is True
          assert m['rules']['exact_duplicate_check'] is True
          assert m['rules']['normalized_duplicate_check'] is True
          assert m['rules']['near_duplicate_check'] is True
          assert m['rules']['schema_validation'] is True
          assert m['rules']['source_and_sha_required_for_knowledge'] is True
          print(f"MANIFEST=PASS train={len(m['train'])} reference={len(m['reference_knowledge'])} eval={len(m['eval'])}")
          print('DATASET_PATHS=PASS')
          print('MULTIMODAL_MODE=PASS')
          PY

      - name: Validate every manifest JSONL dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('training/datasets/manifest_v2.json').read_text(encoding='utf-8'))
          checked = 0
          for section in ('train', 'reference_knowledge', 'eval'):
              for entry in m[section]:
                  p = Path(entry['path'])
                  for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                      if not line.strip():
                          continue
                      obj = json.loads(line)
                      assert isinstance(obj, dict), f'{p}:{n}: record is not an object'
                      checked += 1
          print(f'JSONL=PASS records={checked}')
          PY

      - name: Validate exact train/eval separation from manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('training/datasets/manifest_v2.json').read_text(encoding='utf-8'))
          def fp(x): return json.dumps(x, ensure_ascii=False, sort_keys=True)
          train = set()
          for entry in m['train']:
              for line in Path(entry['path']).read_text(encoding='utf-8').splitlines():
                  if line.strip(): train.add(fp(json.loads(line)))
          collisions = []
          for entry in m['eval']:
              for n, line in enumerate(Path(entry['path']).read_text(encoding='utf-8').splitlines(), 1):
                  if line.strip() and fp(json.loads(line)) in train:
                      collisions.append(f"{entry['path']}:{n}")
          assert not collisions, 'eval/train exact collisions: ' + ', '.join(collisions)
          print('TRAIN_EVAL_EXACT_SEPARATION=PASS')
          PY

      - name: Validate knowledge provenance fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('training/datasets/manifest_v2.json').read_text(encoding='utf-8'))
          for entry in m['reference_knowledge']:
              p = Path(entry['path'])
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  if not line.strip(): continue
                  obj = json.loads(line)
                  assert any(k in obj for k in ('source', 'source_url', 'provenance', 'metadata')), f'{p}:{n}: missing provenance/source metadata'
          print('KNOWLEDGE_PROVENANCE=PASS')
          PY

      - name: Validate multimodal training gate
        run: |
          test -f training/gemma4/MULTIMODAL_TRAINING_PLAN.md
          test -f training/datasets/multimodal/README.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('training/datasets/manifest_v2.json').read_text(encoding='utf-8'))
          mm = [x for x in m['train'] if x['path'].endswith('multimodal_training_curriculum.jsonl')]
          assert mm and mm[0].get('status') == 'requires_native_multimodal_trainer'
          assert m['rules']['do_not_start_training_until_multimodal_trainer_is_ready'] is True
          print('MULTIMODAL_TRAINING_GATE=ACTIVE')
          print('GOOGLE_GPU_TRAINING=NOT_RUN')
          print('LITERT_LM_CONVERSION=NOT_RUN')
          PY
