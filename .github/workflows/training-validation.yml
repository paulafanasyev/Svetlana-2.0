name: Training Validation

on:
  workflow_dispatch:
  push:
    branches: [ 'gpu-training-auto-run' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-training-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Google Gemma training script
        run: python -m py_compile training/kaggle/train_svetlana_smoke.py

      - name: Validate JSONL datasets and train/eval separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          train_files = [
              Path('training/datasets/svetlana_seed.jsonl'),
              Path('training/datasets/self_employed_official.jsonl'),
          ]
          eval_file = Path('training/datasets/svetlana_eval.jsonl')
          train_rows = []
          for path in train_files:
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if not line.strip():
                      continue
                  obj = json.loads(line)
                  assert isinstance(obj, dict)
                  train_rows.append((path, line_no, obj))
          eval_rows = []
          for line_no, line in enumerate(eval_file.read_text(encoding='utf-8').splitlines(), 1):
              if not line.strip():
                  continue
              obj = json.loads(line)
              assert isinstance(obj, dict)
              eval_rows.append((line_no, obj))
          assert train_rows, 'training datasets are empty'
          assert eval_rows, 'evaluation dataset is empty'
          train_fingerprints = set()
          for path, line_no, obj in train_rows:
              if 'messages' in obj:
                  train_fingerprints.add(json.dumps(obj['messages'], ensure_ascii=False, sort_keys=True))
              elif 'question' in obj:
                  train_fingerprints.add(json.dumps([obj['question'], obj.get('answer', '')], ensure_ascii=False, sort_keys=True))
              else:
                  raise AssertionError(f'unsupported training record at {path}:{line_no}')
          for line_no, obj in eval_rows:
              fp = json.dumps(obj.get('messages', obj), ensure_ascii=False, sort_keys=True)
              assert fp not in train_fingerprints, f'evaluation record overlaps training at line {line_no}'
          print(f'VALIDATED training_records={len(train_rows)} eval_records={len(eval_rows)}')
          PY

      - name: Confirm no model weights are checked in
        run: |
          if find training -type f \( -name '*.safetensors' -o -name '*.bin' -o -name '*.pt' -o -name '*.pth' \) | grep -q .; then
            echo 'Unexpected model artifact checked into training tree.'
            exit 1
          fi
          echo 'No trained model artifact is checked into the repository.'
