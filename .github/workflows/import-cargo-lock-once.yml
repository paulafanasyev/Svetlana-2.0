name: Import Cargo.lock from verified Windows build

on:
  push:
    branches:
      - svetlana-2.0-core-development-0416c
    paths:
      - ".github/workflows/import-cargo-lock-once.yml"

permissions:
  actions: read
  contents: write

jobs:
  import-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download Cargo-lock artifact from Windows #237
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Cargo-lock
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 38751764287

      - name: Commit the exact artifact and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s Cargo.lock
          test "$(wc -c < Cargo.lock | tr -d ' ')" = "126138"
          echo "59ded3073e98adad132ce7eabe2bc55fbb408c10ee450f7c56e7fb842a1d9054  Cargo.lock" | sha256sum --check -
          install -m 0644 Cargo.lock src-tauri/Cargo.lock
          rm .github/workflows/import-cargo-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock .github/workflows/import-cargo-lock-once.yml
          git commit -m "ci: commit Cargo.lock from successful Windows build"
          git push origin HEAD:svetlana-2.0-core-development-0416c
