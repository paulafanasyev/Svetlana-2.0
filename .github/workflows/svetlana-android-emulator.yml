name: svetlana-android-emulator
# Проверка Android (эмулятор x86_64, API 34): APK запускается, а инструмент браузера открывает example.com и возвращает DOM-текст.
# Скриншот/logcat и отчёты instrumentation — в артефактах. Скрипт запуска: android-hands/scripts/emulator-smoke.sh.
# Release gate: emulator test must prove real WebView navigation and DOM text readback.
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - svetlana-2.0-core-development-0416c
      - feat/embedded-agent-browser
    paths:
      - "android-hands/**"
      - "src/**"
      - ".github/workflows/svetlana-android-emulator.yml"
  pull_request:
    paths:
      - "android-hands/**"
      - ".github/workflows/svetlana-android-emulator.yml"

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-hands
        run: gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash android-hands/scripts/emulator-smoke.sh
            cd android-hands && gradle connectedDebugAndroidTest --no-daemon
      - name: Verify screenshot and logcat evidence
        if: success()
        run: |
          test -s smoke/screen.png
          signature=$(od -An -tx1 -N8 smoke/screen.png | tr -d ' \n')
          test "$signature" = "89504e470d0a1a0a"
          test -s smoke/logcat.txt
      - name: Upload instrumentation test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-browser-instrumentation-results
          path: |
            android-hands/app/build/reports/androidTests/connected/
            android-hands/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload screenshot and logcat
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-smoke
          path: smoke/
          if-no-files-found: ignore
          retention-days: 7
