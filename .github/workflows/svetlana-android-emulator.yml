name: svetlana-android-emulator-smoke
on:
  push:
    branches: [svetlana-core-v2]
    paths:
      - "android-hands/**"
      - ".github/workflows/svetlana-android-emulator.yml"
  pull_request:
    paths:
      - "android-hands/**"
      - ".github/workflows/svetlana-android-emulator.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK with x86_64
        working-directory: android-hands
        env:
          SV_X86: "1"
        run: gradle assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash android-hands/ci/emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svetlana-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
