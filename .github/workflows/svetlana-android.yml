name: svetlana-android-hands
on:
  push:
    paths:
      - "android-hands/**"
      - ".github/workflows/svetlana-android.yml"
  pull_request:
    paths:
      - "android-hands/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-hands
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: svetlana-hands-debug
          path: android-hands/app/build/outputs/apk/debug/*.apk
