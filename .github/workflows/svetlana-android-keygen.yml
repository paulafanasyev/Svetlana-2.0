name: svetlana-android-keygen

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Для создания ключа введите СОЗДАТЬ"
        required: true
        type: string

permissions:
  contents: read

jobs:
  keygen:
    if: ${{ inputs.confirm == 'СОЗДАТЬ' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate passphrase secret
        env:
          ARCHIVE_PASSPHRASE: ${{ secrets.SVETLANA_KEYGEN_PASSPHRASE }}
        run: |
          if [ "${#ARCHIVE_PASSPHRASE}" -lt 20 ]; then
            echo "::error::SVETLANA_KEYGEN_PASSPHRASE must be at least 20 characters."
            exit 1
          fi
      - name: Generate signing keystore and encrypted archive
        env:
          ARCHIVE_PASSPHRASE: ${{ secrets.SVETLANA_KEYGEN_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full openjdk-21-jdk-headless
          work="${RUNNER_TEMP}/svetlana-keygen"
          mkdir -p "$work/out"
          chmod 700 "$work" "$work/out"

          store_password="$(openssl rand -hex 32)"
          key_password="$(openssl rand -hex 32)"
          alias_name="svetlana"

          keytool -genkeypair -noprompt \
            -keystore "$work/out/svetlana.jks" \
            -storetype JKS \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias "$alias_name" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Svetlana Android, OU=Release, O=Mir Samozanyatykh, C=VN"

          base64 -w 0 "$work/out/svetlana.jks" > "$work/out/SVETLANA_KEYSTORE_B64.txt"
          printf '%s' "$store_password" > "$work/out/SVETLANA_KEYSTORE_PASSWORD.txt"
          printf '%s' "$alias_name" > "$work/out/SVETLANA_KEY_ALIAS.txt"
          printf '%s' "$key_password" > "$work/out/SVETLANA_KEY_PASSWORD.txt"

          (
            cd "$work/out"
            7z a -t7z -mhe=on -p"$ARCHIVE_PASSPHRASE" "$work/svetlana-android-key.7z" \
              SVETLANA_KEYSTORE_B64.txt \
              SVETLANA_KEYSTORE_PASSWORD.txt \
              SVETLANA_KEY_ALIAS.txt \
              SVETLANA_KEY_PASSWORD.txt
          )

          # Remove plaintext key material before uploading the encrypted archive.
          rm -f "$work/out/"*.txt "$work/out/svetlana.jks"
          test -s "$work/svetlana-android-key.7z"
      - name: Upload encrypted key archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: svetlana-android-key-encrypted
          path: ${{ runner.temp }}/svetlana-keygen/svetlana-android-key.7z
          if-no-files-found: error
          retention-days: 1
