name: Action Corpus Validation

on:
  push:
    branches:
      - 'feat/action-corpus-v1-20260919'
  pull_request:
    branches:
      - 'fix/assistant-only-sft-loss-20260918'

jobs:
  validate-action-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit action corpus
        run: python training/evaluation/audit_action_corpus.py
      - name: Validate JSONL
        run: python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path('training/datasets/svetlana_action_training_v1.jsonl'),
              Path('training/datasets/svetlana_action_eval_v1.jsonl'),
          ]:
              for n, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                  if line.strip():
                      json.loads(line)
          print('ACTION_JSONL=PASS')
          PY
