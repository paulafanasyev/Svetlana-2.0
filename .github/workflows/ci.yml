name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'svetlana-2.0-core-development-*', 'feat/embedded-agent-browser' ]
  pull_request:
    branches: [ main, develop, 'svetlana-2.0-core-development-*' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Use Node.js 22
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Check for stub implementations
      run: |
        echo "Checking for stub implementations..."
        if grep -r "base64_data" src/services/ --include="*.ts"; then
          echo "❌ Found fake 'base64_data' in services"
          exit 1
        fi
        if grep -r "This would integrate" src/services/ --include="*.ts"; then
          echo "❌ Found stub comments in services"
          exit 1
        fi
        echo "✅ Stub check completed"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Use Node.js 22
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npm run lint

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Use Node.js 22
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Security audit (production, high+ fails)
      run: npm audit --omit=dev --audit-level=high
    - name: Full audit report (dev tools, informational)
      continue-on-error: true
      run: npm audit --audit-level=moderate
    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded secrets..."
        if grep -rE "(sk-|key-|api_key|apiKey|password|secret)" src/ --include="*.ts" --include="*.tsx" | grep -v "test" | grep -v "__tests__" | grep -v "type.*string" | grep -v "interface" | grep -v "// "; then
          echo "⚠️ Potential secrets found - review manually"
        else
          echo "✅ No obvious secrets found"
        fi
