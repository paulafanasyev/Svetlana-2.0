name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'svetlana-2.0-core-development-*', 'svetlana-self-employed-crm-foundation', 'knowledge-business-expansion-*', 'plan0-runtime-gate-*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npm run typecheck
    - name: Build
      run: npm run build
    - name: Run tests
      run: npm test
    - name: Check for stub implementations
      run: |
        if grep -r "base64_data" src/services/ --include="*.ts"; then exit 1; fi
        if grep -r "This would integrate" src/services/ --include="*.ts"; then exit 1; fi

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'
    - run: npm ci
    - run: npm run lint || echo "Lint not configured"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'
    - run: npm audit --audit-level=moderate || echo "Audit completed with warnings"
    - name: Check for hardcoded secrets
      run: |
        if grep -rE "(sk-|key-|api_key|apiKey|password|secret)" src/ --include="*.ts" --include="*.tsx" | grep -v "test" | grep -v "__tests__" | grep -v "type.*string" | grep -v "interface" | grep -v "// "; then echo "Potential secrets found - review manually"; fi

  native-android:
    name: Native Android Plan 0 build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Assemble native Android APK
      working-directory: android
      run: gradle :app:assembleDebug --stacktrace
    - run: test -s android/app/build/outputs/apk/debug/app-debug.apk
    - uses: actions/upload-artifact@v4
      with:
        name: svetlana-plan0-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

  native-android-runtime:
    name: Native Android Plan 0 runtime gate
    needs: native-android
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        name: svetlana-plan0-debug-apk
        path: android-apk
    - name: Start Android emulator and verify real AccessibilityService action
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
        disable-animations: true
        script: bash "$GITHUB_WORKSPACE/.github/scripts/plan0-runtime.sh"
    - name: Upload Plan 0 runtime evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: svetlana-plan0-runtime-evidence
        path: |
          accessibility-dumpsys.txt
          window.xml
          plan0-logcat.txt
          service-logcat.txt
          plan0-apk-sha256.txt
          plan0-runtime-apk-sha256.txt
        if-no-files-found: warn

  plan0-ui-diagnostic:
    name: Plan 0 clean Settings UI diagnostic
    needs: native-android
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        name: svetlana-plan0-debug-apk
        path: android-apk
    - name: Run clean Settings UI + UIAutomator experiment
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
        disable-animations: true
        script: bash "$GITHUB_WORKSPACE/.github/scripts/plan0-ui-diagnostic.sh"
    - name: Upload complete UI diagnostic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: svetlana-plan0-ui-diagnostic-evidence
        path: plan0-ui-evidence
        if-no-files-found: warn
