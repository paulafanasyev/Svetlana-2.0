name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'svetlana-2.0-core-development-*', 'svetlana-self-employed-crm-foundation', 'knowledge-business-expansion-*', 'plan0-runtime-gate-*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Check for stub implementations
      run: |
        echo "Checking for stub implementations..."
        if grep -r "base64_data" src/services/ --include="*.ts"; then
          echo "❌ Found fake 'base64_data' in services"
          exit 1
        fi
        if grep -r "This would integrate" src/services/ --include="*.ts"; then
          echo "❌ Found stub comments in services"
          exit 1
        fi
        echo "✅ Stub check completed"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npm run lint || echo "Lint not configured"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Run security audit
      run: npm audit --audit-level=moderate || echo "Audit completed with warnings"
    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded secrets..."
        if grep -rE "(sk-|key-|api_key|apiKey|password|secret)" src/ --include="*.ts" --include="*.tsx" | grep -v "test" | grep -v "__tests__" | grep -v "type.*string" | grep -v "interface" | grep -v "// "; then
          echo "⚠️ Potential secrets found - review manually"
        else
          echo "✅ No obvious secrets found"
        fi

  native-android:
    name: Native Android Plan 0 build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle 8.9
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Assemble native Android APK
      working-directory: android
      run: gradle :app:assembleDebug --stacktrace

    - name: Verify APK exists
      run: test -s android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Plan 0 APK
      uses: actions/upload-artifact@v4
      with:
        name: svetlana-plan0-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
