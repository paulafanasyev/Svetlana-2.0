name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'svetlana-2.0-core-development-*', 'svetlana-self-employed-crm-foundation', 'knowledge-business-expansion-*', 'plan0-runtime-gate-*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Check for stub implementations
      run: |
        echo "Checking for stub implementations..."
        if grep -r "base64_data" src/services/ --include="*.ts"; then
          echo "❌ Found fake 'base64_data' in services"
          exit 1
        fi
        if grep -r "This would integrate" src/services/ --include="*.ts"; then
          echo "❌ Found stub comments in services"
          exit 1
        fi
        echo "✅ Stub check completed"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npm run lint || echo "Lint not configured"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Run security audit
      run: npm audit --audit-level=moderate || echo "Audit completed with warnings"
    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded secrets..."
        if grep -rE "(sk-|key-|api_key|apiKey|password|secret)" src/ --include="*.ts" --include="*.tsx" | grep -v "test" | grep -v "__tests__" | grep -v "type.*string" | grep -v "interface" | grep -v "// "; then
          echo "⚠️ Potential secrets found - review manually"
        else
          echo "✅ No obvious secrets found"
        fi

  native-android:
    name: Native Android Plan 0 build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle 8.9
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Assemble native Android APK
      working-directory: android
      run: gradle :app:assembleDebug --stacktrace

    - name: Verify APK exists
      run: test -s android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Plan 0 APK
      uses: actions/upload-artifact@v4
      with:
        name: svetlana-plan0-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

  native-android-runtime:
    name: Native Android Plan 0 runtime gate
    needs: native-android
    runs-on: ubuntu-latest
    steps:
    - name: Download Plan 0 APK
      uses: actions/download-artifact@v4
      with:
        name: svetlana-plan0-debug-apk
        path: android-apk

    - name: Verify downloaded Plan 0 APK before emulator
      shell: bash
      run: |
        set -euo pipefail
        echo '--- Plan 0 APK preflight ---'
        echo "PWD=$PWD"
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        echo '--- downloaded files ---'
        find "$GITHUB_WORKSPACE/android-apk" -maxdepth 3 -type f -print
        APK="$GITHUB_WORKSPACE/android-apk/app-debug.apk"
        test -f "$APK"
        test -s "$APK"
        echo "APK=$APK"
        ls -lh "$APK"
        sha256sum "$APK" | tee plan0-apk-sha256.txt

    - name: Start Android emulator and verify real AccessibilityService action
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: default
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
        disable-animations: true
        script: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android-apk/app-debug.apk"
          echo '--- Plan 0 runtime APK preflight ---'
          echo "PWD=$PWD"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee plan0-runtime-apk-sha256.txt

          adb install -r "$APK"
          adb shell am start -n com.svetlana.android.hands/.MainActivity
          adb shell settings put secure enabled_accessibility_services com.svetlana.android.hands/com.svetlana.android.hands.SvetlanaAccessibilityService
          adb shell settings put secure accessibility_enabled 1

          sleep 3

          echo '--- registered/enabled accessibility services ---'
          adb shell settings get secure enabled_accessibility_services
          adb shell dumpsys accessibility | tee accessibility-dumpsys.txt

          grep -q 'com.svetlana.android.hands/com.svetlana.android.hands.SvetlanaAccessibilityService' accessibility-dumpsys.txt
          adb logcat -d -s SvetlanaPlan0:I '*:S' > service-logcat.txt
          grep -q 'PLAN0_SERVICE_CONNECTED=PASS' service-logcat.txt

          echo '--- UI state after AccessibilityService action ---'
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb shell cat /sdcard/window.xml | tee window.xml
          grep -q 'PLAN0_STATUS=ACTION_PERFORMED' window.xml

          echo '--- Plan 0 runtime evidence ---'
          adb logcat -d -s SvetlanaPlan0:I '*:S' | tee plan0-logcat.txt
          grep -q 'PLAN0_NODE_FOUND=PASS' plan0-logcat.txt
          grep -q 'PLAN0_ACTION_CLICK=PASS' plan0-logcat.txt
          grep -q 'PLAN0_REAL_ANDROID_ACTION=PASS' plan0-logcat.txt

    - name: Upload Plan 0 runtime evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: svetlana-plan0-runtime-evidence
        path: |
          accessibility-dumpsys.txt
          window.xml
          plan0-logcat.txt
          service-logcat.txt
          plan0-apk-sha256.txt
          plan0-runtime-apk-sha256.txt
        if-no-files-found: warn
