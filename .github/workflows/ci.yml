name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'svetlana-2.0-core-development-*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Type check
      run: npm run typecheck
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Check for stub implementations
      run: |
        echo "Checking for stub implementations..."
        
        # Check for fake success patterns
        if grep -r "success: true" src/services/ --include="*.ts" | grep -v "test" | grep -v "__tests__"; then
          echo "⚠️  Found 'success: true' in services - verify these are not stubs"
        fi
        
        # Check for fake screenshot data
        if grep -r "base64_data" src/services/ --include="*.ts"; then
          echo "❌ Found fake 'base64_data' in services"
          exit 1
        fi
        
        # Check for stub comments
        if grep -r "This would integrate" src/services/ --include="*.ts"; then
          echo "❌ Found stub comments in services"
          exit 1
        fi
        
        echo "✅ Stub check completed"

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint || echo "Lint not configured"

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run security audit
      run: npm audit --audit-level=moderate || echo "Audit completed with warnings"
    
    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded secrets..."
        
        # Check for common secret patterns
        if grep -rE "(sk-|key-|api_key|apiKey|password|secret)" src/ --include="*.ts" --include="*.tsx" | grep -v "test" | grep -v "__tests__" | grep -v "type.*string" | grep -v "interface" | grep -v "// "; then
          echo "⚠️  Potential secrets found - review manually"
        else
          echo "✅ No obvious secrets found"
        fi
