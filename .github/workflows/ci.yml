name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'svetlana-2.0-core-development-*', 'svetlana-self-employed-crm-foundation', 'fix/assistant-only-sft-loss-20260918' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Check for stub implementations
      run: |
        echo "Checking for stub implementations..."
        if grep -r "base64_data" src/services/ --include="*.ts"; then
          echo "❌ Found fake 'base64_data' in services"
          exit 1
        fi
        if grep -r "This would integrate" src/services/ --include="*.ts"; then
          echo "❌ Found stub comments in services"
          exit 1
        fi
        echo "✅ Stub check completed"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npm run lint || echo "Lint not configured"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run security audit
      run: npm audit --audit-level=moderate || echo "Audit completed with warnings"
    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded secrets..."
        if grep -rE "(sk-|key-|api_key|apiKey|password|secret)" src/ --include="*.ts" --include="*.tsx" | grep -v "test" | grep -v "__tests__" | grep -v "type.*string" | grep -v "interface" | grep -v "// "; then
          echo "⚠️ Potential secrets found - review manually"
        else
          echo "✅ No obvious secrets found"
        fi


  gemma4-tokenizer-preflight:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install training preflight dependencies
      run: python -m pip install --upgrade pip && python -m pip install 'transformers>=5.0.0' datasets sentencepiece
    - name: Run real Gemma 4 tokenizer preflight
      run: python training/gemma4/tokenizer_preflight.py --model google/gemma-4-E2B-it --max-length 2048
