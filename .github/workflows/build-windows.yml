name: Build Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - svetlana-2.0-core-development-0416c
      - feature/windows-hands-mcp-skeleton
      - feat/embedded-agent-browser
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  TAURI_CLI_VERSION: "2.12.3"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust ${{ env.RUST_VERSION }}
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy
          rustup default $env:RUST_VERSION
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # The released installer must contain its own Node runtime, Playwright dependencies and Chromium.
      # This is prepared on the Windows runner and copied as Tauri resources; end users do not install Node.
      - name: Prepare self-contained browser runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm install --prefix browser-worker --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Не удалось установить Browser Worker" }
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:GITHUB_WORKSPACE "browser-worker/.browsers"
          New-Item -ItemType Directory -Force $env:PLAYWRIGHT_BROWSERS_PATH | Out-Null
          Push-Location browser-worker
          try {
            npx playwright install --only-shell chromium
            if ($LASTEXITCODE -ne 0) { throw "Не удалось скачать Chromium для Browser Worker" }
          } finally {
            Pop-Location
          }
          $nodeExe = (Get-Command node.exe).Source
          Copy-Item $nodeExe "browser-worker/node.exe" -Force
          if (-not (Test-Path "browser-worker/node.exe")) { throw "Не удалось подготовить автономный Node runtime" }
          if (-not (Test-Path "browser-worker/.browsers")) { throw "Chromium не был подготовлен" }
          Write-Host "Bundled Node: $nodeExe"
          Write-Host "Bundled Chromium directory: browser-worker/.browsers"
          npm run --prefix browser-worker test
          if ($LASTEXITCODE -ne 0) { throw "Browser Worker security tests failed" }
          npm run --prefix browser-worker test:e2e
          if ($LASTEXITCODE -ne 0) { throw "Browser Worker runtime smoke test failed" }
          # Re-run the E2E test with the exact node.exe that will ship in the installer.
          & ".\browser-worker\node.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node runtime is not executable" }
          & ".\browser-worker\node.exe" ".\browser-worker\smoke.mjs"
          if ($LASTEXITCODE -ne 0) { throw "Bundled Node + Playwright + Chromium smoke test failed" }

      - name: Cargo.lock
        id: lock
        shell: pwsh
        run: |
          if (Test-Path src-tauri/Cargo.lock) {
            "committed=true" >> $env:GITHUB_OUTPUT
          } else {
            "committed=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Cargo.lock нет в репозитории: скачайте артефакт Cargo-lock и закоммитьте его как src-tauri/Cargo.lock"
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw "Не удалось создать Cargo.lock" }
          }
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Cargo.lock не совпадает с Cargo.toml" }

      - name: Upload Cargo.lock
        if: steps.lock.outputs.committed != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 30

      - name: Rust tests
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Тесты Rust упали" }

      # Пока только предупреждения (список в логе и во вкладке Summary). Когда почистим, уберём continue-on-error.
      - name: Clippy (warnings only for now)
        continue-on-error: true
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets 2>&1 | Tee-Object -FilePath clippy.txt
          $warnings = (Select-String -Path clippy.txt -Pattern '^warning' -SimpleMatch:$false).Count
          "### Clippy: предупреждений $warnings" >> $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "Clippy нашёл ошибки" }

      - name: Install Tauri CLI ${{ env.TAURI_CLI_VERSION }}
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build Tauri NSIS installer
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo tauri build --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Сборка установщика упала" }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File
          if (-not $installer) {
            throw "Tauri build completed without producing an NSIS .exe installer."
          }
          $installer | ForEach-Object {
            Write-Host ("Installer: {0} ({1} bytes)" -f $_.FullName, $_.Length)
          }

      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SvetlanaSetup-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Публикация в Releases (тег app-v<версия>, постоянное имя файла): на него ведёт «Скачать для Windows» на сайте.
  # Отдельная работа с правом записи: сама сборка и чужой код зависимостей с этим правом не запускаются.
  # Одна очередь svetlana-release на все ветки и оба приложения: в один тег никто не пишет одновременно.
  # Final publication is intentionally gated by [publish-release] after device acceptance.
  release:
    needs: build-windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/svetlana-2.0-core-development-0416c' || github.ref == 'refs/heads/main') && contains(github.event.head_commit.message, '[publish-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: svetlana-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: SvetlanaSetup-Windows
          path: dl
      - name: Prepare release file
        id: v
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p release-assets
          cp "$(ls dl/*.exe | head -n 1)" release-assets/Svetlana-2.0-Windows-setup.exe
          (cd release-assets && sha256sum Svetlana-2.0-Windows-setup.exe > checksums.txt)
      - name: Publish to Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: app-v${{ steps.v.outputs.version }}
          name: Светлана 2.0 ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: |
            release-assets/Svetlana-2.0-Windows-setup.exe
            release-assets/checksums.txt
          body: |
            Светлана 2.0 для Windows 10/11 и Android: чат и голос, выбор ИИ (в том числе бесплатный GigaChat), CRM, связь с телефоном.
            Установщик Windows пока без цифровой подписи: если SmartScreen предупредит, «Подробнее», потом «Выполнить в любом случае».
            SHA-256 лежат в checksums.txt и android-checksums.txt.
