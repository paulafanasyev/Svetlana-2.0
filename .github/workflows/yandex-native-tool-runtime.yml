name: Yandex Native Tool Runtime Gate

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Yandex model ID'
        required: false
        default: 'aliceai-llm-flash'
        type: string

jobs:
  yandex-structured-tool-call:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      YANDEX_MODEL: ${{ inputs.model }}
    steps:
      - name: Require Yandex credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${YANDEX_API_KEY}" || -z "${YANDEX_FOLDER_ID}" ]]; then
            echo 'PENDING: YANDEX_API_KEY and/or YANDEX_FOLDER_ID Actions secret is not configured.'
            exit 78
          fi

      - name: Call Yandex OpenAI-compatible API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          body = {
              'model': f"gpt://{os.environ['YANDEX_FOLDER_ID']}/{os.environ['YANDEX_MODEL']}",
              'messages': [
                  {'role': 'system', 'content': 'Return exactly one function call. Do not answer with prose.'},
                  {'role': 'user', 'content': 'Open the Android settings application.'},
              ],
              'tools': [{
                  'type': 'function',
                  'function': {
                      'name': 'open_app',
                      'description': 'Open an Android application by package name.',
                      'parameters': {
                          'type': 'object',
                          'properties': {'packageName': {'type': 'string'}},
                          'required': ['packageName']
                      }
                  }
              }],
              'tool_choice': 'required',
              'temperature': 0.0,
              'max_tokens': 256,
          }
          with open('request.json', 'w', encoding='utf-8') as f:
              json.dump(body, f, ensure_ascii=False)
          PY
          curl --fail-with-body --silent --show-error \
            -X POST 'https://ai.api.cloud.yandex.net/v1/chat/completions' \
            -H "Authorization: Api-Key ${YANDEX_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @request.json > response.json

      - name: Verify external structured tool call
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('response.json', encoding='utf-8') as f:
              data = json.load(f)
          message = data.get('choices', [{}])[0].get('message', {})
          calls = message.get('tool_calls') or []
          if not calls:
              raise SystemExit('FAIL: Yandex API returned no structured tool_calls')
          call = calls[0]
          function = call.get('function') or {}
          if function.get('name') != 'open_app':
              raise SystemExit(f"FAIL: unexpected tool name: {function.get('name')!r}")
          raw_args = function.get('arguments')
          try:
              args = json.loads(raw_args) if isinstance(raw_args, str) else raw_args
          except Exception as e:
              raise SystemExit(f'FAIL: tool arguments are not valid JSON: {e}')
          if not isinstance(args, dict) or not isinstance(args.get('packageName'), str) or not args['packageName']:
              raise SystemExit('FAIL: packageName is missing or not a non-empty string')
          print('PASS: external Yandex structured tool call received')
          print(json.dumps({'tool': function['name'], 'arguments': {'packageName': args['packageName']}, 'call_id': call.get('id')}, ensure_ascii=False))
          PY
